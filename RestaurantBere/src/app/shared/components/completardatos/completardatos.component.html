<div class="datos container">
  <nav style="--bs-breadcrumb-divider: '';" aria-label="breadcrumb">
    <div class="container">
      <div class="row">
  
            <div class="col-md-5 text-end">
             
            </div>
            <div class="progress-container col-md-3  text-center">
              <div class="circle completed">1</div>
              <div class="line"></div>
              <div class="circle completed">2</div>
              <div class="line"></div>
              <div class="circle completed">3</div>
              <div class="line"></div>
              <div class="circle completed">4</div>
            </div>
            <div class="col-md-4 text-end">
              <h2>Completar datos</h2>
            </div>
  
      </div>
    </div>
  </nav>

  <form #clienteForm="ngForm" (ngSubmit)="onSubmit(clienteForm, $event)">
    <div class="form-container rounded-4" >
      <h2>Datos personales</h2>
      
          <div class="form-group">
              <input class="rounded-pill" type="text" placeholder="DNI" id="dni" name="dni" ngModel required>
              
              <input class="rounded-pill" placeholder="Nombre completo" type="text" id="name" name="name" ngModel required>
              
              <input class="rounded-pill" type="text" placeholder="Teléfono"  id="phone" name="phone" ngModel required>
          </div>
          
          <div class="form-group full-width">
            <input class="rounded-pill" type="email" placeholder="Correo" id="email" name="email" ngModel required>
            <input class="rounded-pill" type="text" placeholder="Direccion" id="address" name="address" ngModel required>
          </div>
   
          <div class="row text-center mb-4 mt-4">       
            <div class="col-md">
              <button class="btn btn-outline-light" type="button" (click)="navigateToHome()">Cancelar</button>
            </div>
            <div class="col-md">
              <button type="submit" class="btn btn-light"  >Ingresar Datos</button>
            </div>
          </div>
    </div>
  </form>
</div>
