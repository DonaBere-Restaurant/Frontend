<div class="container ">
    <div class="row">

        <div class="col-md-5 text-end">
         
        </div>
        <div class="progress-container col-md-3  text-center">
          <div class="circle completed">1</div>
          <div class="line"></div>
          <div class="circle">2</div>
          <div class="line"></div>
          <div class="circle">3</div>
          <div class="line"></div>
          <div class="circle">4</div>
        </div>
        <div class="col-md-4 text-end p-2">
          <h2>Elije una fecha</h2>
        </div>

  </div>
    <div class="row">
        <form #reservaForm="ngForm" (ngSubmit)="onSubmit(reservaForm, $event)">
            <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }}
              </div>
            <div class="row">
                <h2>Seleccione una opción:</h2>
                <div class="col-md-6">
                    <div class="row-md text-center mb-4">
                        <ngb-datepicker #dp [(ngModel)]="model" name="date" (navigate)="date = $event.next" required [minDate]="minDate" 
                        [maxDate]="maxDate" ></ngb-datepicker>
                    </div>
                    <div class="row-md text-center">
                        <button type="button" class="btn btn-outline-primary me-2" (click)="model = today">Select Today</button>
                    </div>
                </div>
        
                <div class="col-md-6 text-center">
                    <div class="row mb-4 mt-4">
                        <div class="col">
                            <button type="button" class="btn btn-sm btn-outline-primary me-3" (click)="setTime(12 , 00)">12:00</button>
                            <button type="button" class="btn btn-sm btn-outline-primary me-3" (click)="setTime(14 , 00)">14:00</button>
                            <button type="button" class="btn btn-sm btn-outline-primary me-3" (click)="setTime(17 , 00)">17:00</button>
                            <button type="button" class="btn btn-sm btn-outline-primary me-3" (click)="setTime(18 , 00)">18:00</button>
                            <button type="button" class="btn btn-sm btn-outline-primary me-3" (click)="setTime(21 , 00)">21:00</button>
                        </div>
                    </div>
        
                    <div class="row ">
                        <div class="col ">
                            <p class="mt-2">Hora: </p>
                        </div>
                        <div class="col">
                            <ngb-timepicker [(ngModel)]="time" name="time" [spinners]="false" required></ngb-timepicker>
                        </div>
                    </div>
                    
                    <div class="row mt-3" *ngIf="showSpecialButton">
                        <div class="col">
                            <button type="button" class="btn btn-success" [disabled]="reservaForm.invalid" 
                            data-bs-toggle="modal" data-bs-target="#staticBackdrop" >
                      Reservar todas las mesas
                    </button>
                        </div>
                    </div>
                </div>
        
                <div class="row text-center mb-4 mt-4">       
                    <div class="col-md">
                        <button class="btn btn-outline-dark" type="button" (click)="navigateToCreateAcc()">Cancelar</button>
                    </div>
                    <div class="col-md">
                        <button type="submit" class="btn btn-dark" [disabled]="reservaForm.invalid">Seleccionar Mesas</button>
                    </div>
                </div>
            </div>
        </form>
    </div> 
</div>


<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5 text-danger" id="staticBackdropLabel">!Advertencia¡</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Solo se puede reservar el restaurante 2 veces al día y con 30 días de anticipación, 12pm-5pm y 6pm-11pm
            </p>
          <p>
            Se le cobrar un total de 300 soles por reservar todo el restaurante, aparte del consumo
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" >Cancelar</button>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal" (click)="prepareAllTableReservation()">Continuar</button>
        </div>
      </div>
    </div>
  </div>
